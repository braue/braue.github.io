<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#081f42" />
  <meta name="description" content="Music Downloader surfaces the top albums and songs with Tidal and Amazon Music links." />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Music Downloader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <h1>Music Downloader</h1>
    </div>
  </header>

  <main class="content-shell">
    <form id="searchForm" class="search-form">
      <label class="sr-only" for="query">Artist, album, or song</label>
      <input autocomplete="off" autocapitalize="words" autocorrect="off" id="query" name="query" placeholder="Search Artist • Album • Song" required />
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status">Find a match and download the streaming links.</p>

    <section id="results"></section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
